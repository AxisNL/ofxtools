{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{% static "bootstrap/5.3.8/css/bootstrap.min.css" %}">
  <script src="{% static "jquery/jquery-4.0.0.min.js" %}"></script>
  <script src="{% static "bootstrap/5.3.8/js/bootstrap.min.js" %}"></script>
</head>
<body>

<div class="container">
  <h1>MCB OFX naar Quickbooks OFX</h1>
  <p>Je kunt (als particulier) je transacties van de Rabobank downloaden als CSV. Let erop dat je alleen 'afgesloten dagen' in het verleden kunt kiezen. Dit script ondersteunt zowel betaalrekeningen als creditcards.</p>

    <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="file" name="myfile">
    <button type="submit">Upload</button>
  </form>

</div>

</body>
</html>
