version: "3"

services:

  ofxtools:
    image: axisnl/ofxtools:latest
    container_name: ofxtools
    restart: unless-stopped
    ports:
    - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/1

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
